[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "manufacturing-platform"
version = "0.1.0"
description = "Persistent manufacturing workbench business package"
requires-python = ">=3.11"
dependencies = ["fastapi>=0.115,<1", "pydantic>=2,<3"]

[project.optional-dependencies]
test = ["pytest>=8", "httpx>=0.27"]
production-tools = ["PyMySQL>=1.1,<2", "psycopg[binary]>=3.2,<4", "oss2>=2.19,<3"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
manufacturing_platform = ["catalog.json"]
